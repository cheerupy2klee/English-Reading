<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Results · 실시간 결과</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="wrap screen-head">
      <div style="flex:1;min-width:240px">
        <p id="actTitle" style="margin:0 0 4px"></p>
        <h1 id="question" class="question">실시간 결과</h1>
      </div>
      <div class="join-box" id="joinBox">
        <small>참여: <span id="joinUrl"></span></small>
        <div>PIN <span class="pin" id="pinText"></span></div>
      </div>
    </div>
  </header>
  <main>
    <div id="demo"></div>

    <section id="pinPanel" class="panel hidden">
      <form id="pinForm" class="row"><input id="pinInput" type="text" inputmode="numeric" maxlength="6" placeholder="PIN 6자리" style="max-width:220px"><button class="primary">결과 보기</button></form>
      <p id="pinError" class="error"></p>
    </section>

    <section id="resultPanel" class="panel hidden" aria-live="polite">
      <div class="row" style="justify-content:space-between;margin-bottom:18px">
        <span class="big-count"><span id="status" class="badge"></span> 응답 <span id="count">0</span>개</span>
        <div class="view-tabs" id="viewTabs" role="group" aria-label="결과 표시 방식"></div>
      </div>
      <div id="locked" class="note hidden">결과가 아직 공개되지 않았어요.</div>
      <div id="results"></div>
    </section>

    <section id="ownerPanel" class="panel hidden" aria-label="선생님 도구">
      <div class="row" style="gap:8px 22px">
        <label class="check"><input type="checkbox" id="showNames"> 화면에 학생 이름 표시</label>
        <label class="check"><input type="checkbox" id="moderate"> 응답 숨기기 버튼 보기</label>
        <label class="check"><input type="checkbox" id="resultsVisible"> 학생 화면에 결과 공개</label>
        <button id="statusBtn" class="small"></button>
        <button id="fullBtn" class="small">전체 화면</button>
        <a class="btn small" href="teacher.html">대시보드로</a>
      </div>
      <p class="muted" style="margin:10px 0 0;font-size:.9rem">이 도구는 활동을 만든 선생님에게만 보여요. 숨긴 응답은 학생 화면과 그래프에서 빠져요.</p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="common.js"></script>
  <script>
    const { api, $, esc, TYPES, VIEWS, friendly, renderResults, toast, demoBanner } = LivePoll;
    demoBanner($('demo'));
    const joinUrl = new URL('index.html', location.href).href;
    $('joinUrl').textContent = joinUrl.replace(/^https?:\/\//, '');
    let pin = (new URLSearchParams(location.search).get('pin') || '').replace(/\D/g, '').slice(0, 6);
    let act = null, data = null, view = null, serverView = null, namesInit = false, unsub = null;

    $('pinForm').addEventListener('submit', e => {
      e.preventDefault();
      const v = $('pinInput').value.trim();
      if (!/^\d{6}$/.test(v)) { $('pinError').textContent = 'PIN 6자리를 입력해 주세요.'; return; }
      location.search = '?pin=' + v;
    });

    async function refresh() {
      try {
        data = await api.getResults(pin, false);
        if (!data) { $('pinPanel').classList.remove('hidden'); $('resultPanel').classList.add('hidden'); $('pinError').textContent = friendly(new Error('NOT_FOUND')).message; return; }
        act = data.activity;
        // 다른 화면에서 선생님이 표시 방식을 바꾸면 따라가기
        if (serverView !== act.result_view) { serverView = act.result_view; view = act.result_view; }
        if (act.is_owner && !namesInit) { namesInit = true; $('showNames').checked = act.identity_mode === 'public'; }
        draw();
      } catch (err) { console.warn(friendly(err).message); }
    }

    function draw() {
      $('resultPanel').classList.remove('hidden');
      document.title = act.question + ' · 실시간 결과';
      $('actTitle').textContent = [act.class_name, act.title].filter(Boolean).join(' · ');
      $('question').textContent = act.question;
      $('pinText').textContent = act.pin;
      $('status').textContent = act.status === 'open' ? '진행 중' : '마감';
      $('status').className = 'badge ' + act.status;
      const owner = act.is_owner;
      $('ownerPanel').classList.toggle('hidden', !owner);
      $('resultsVisible').checked = act.results_visible;
      $('statusBtn').textContent = act.status === 'open' ? '응답 마감하기' : '응답 다시 받기';
      $('viewTabs').innerHTML = TYPES[act.response_type].views.map(v =>
        `<button class="small" data-view="${v}" aria-pressed="${v === view}">${VIEWS[v]}</button>`).join('');
      $('locked').classList.toggle('hidden', !!data.responses);
      if (!data.responses) { $('results').innerHTML = ''; $('results')._lpKey = null; $('count').textContent = '–'; return; }
      $('count').textContent = data.responses.filter(r => !r.hidden).length;
      renderResults($('results'), act, data.responses, view, {
        owner: owner && $('moderate').checked,
        showNames: act.identity_mode === 'public' || (owner && $('showNames').checked),
        onHide: async (id, hidden) => { try { await api.setHidden(pin, id, hidden); refresh(); } catch (err) { toast(friendly(err).message); } },
      });
    }

    $('viewTabs').addEventListener('click', async e => {
      const b = e.target.closest('button[data-view]'); if (!b || !act) return;
      view = b.dataset.view; draw();
      if (act.is_owner) { // 선생님이 바꾸면 학생 화면도 같은 방식으로 표시
        serverView = view;
        try { await api.updateActivity(act, { result_view: view }); } catch (err) { toast(friendly(err).message); }
      }
    });
    $('showNames').addEventListener('change', () => act && draw());
    $('moderate').addEventListener('change', () => act && draw());
    $('resultsVisible').addEventListener('change', async e => {
      try { await api.updateActivity(act, { results_visible: e.target.checked }); refresh(); } catch (err) { toast(friendly(err).message); }
    });
    $('statusBtn').addEventListener('click', async () => {
      try { await api.updateActivity(act, { status: act.status === 'open' ? 'closed' : 'open' }); refresh(); } catch (err) { toast(friendly(err).message); }
    });
    $('fullBtn').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());

    if (/^\d{6}$/.test(pin)) {
      unsub = api.subscribe(pin, refresh);
      refresh();
    } else {
      $('pinPanel').classList.remove('hidden');
      $('joinBox').classList.add('hidden');
    }
  </script>
</body>
</html>
