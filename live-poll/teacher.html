<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Classroom · 교사 대시보드</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div class="wrap"><h1>My Classroom</h1><p>질문을 만들고, 학생들의 의견을 실시간으로 모아 보세요.</p></div></header>
  <main>
    <div id="demo"></div>

    <!-- 교사 로그인 (Supabase 모드에서만) -->
    <section id="loginPanel" class="panel hidden" aria-labelledby="login-title">
      <h2 id="login-title">교사 로그인</h2>
      <form id="loginForm" novalidate style="max-width:420px">
        <label for="email">이메일</label><input id="email" type="email" autocomplete="username">
        <label for="password">비밀번호 (6자 이상)</label><input id="password" type="password" autocomplete="current-password">
        <div class="row" style="margin-top:14px"><button class="primary" type="submit">로그인</button><button type="button" id="signupBtn">처음이에요 (가입)</button></div>
        <p id="loginError" class="error" aria-live="polite"></p>
      </form>
    </section>

    <div id="dash" class="hidden">
      <div class="row" style="justify-content:space-between;margin-top:30px">
        <button class="primary" id="newBtn" style="font-size:1.05rem">＋ 새 활동 만들기</button>
        <span class="muted"><span id="who"></span> <button class="small" id="logoutBtn">로그아웃</button></span>
      </div>

      <!-- 새 활동 만들기 -->
      <section id="createPanel" class="panel hidden" aria-labelledby="create-title">
        <h2 id="create-title">새 활동 만들기</h2>
        <form id="createForm" novalidate>
          <h3 style="margin-top:14px">Step 1. 질문</h3>
          <div class="grid2">
            <div><label for="className">반 (선택)</label><input id="className" type="text" maxlength="40" placeholder="예: 1학년 5반"></div>
            <div><label for="title">활동 제목</label><input id="title" type="text" maxlength="100" placeholder="예: What makes a good leader?"></div>
          </div>
          <label for="questionInput">질문</label>
          <textarea id="questionInput" maxlength="500" style="min-height:80px" placeholder="예: What is the most important quality of a good leader?"></textarea>

          <h3 style="margin-top:22px">Step 2. 응답 유형</h3>
          <p class="intro">어떤 방식으로 답변을 받을까요?</p>
          <div class="tiles" id="typeTiles"></div>
          <div id="optionsBox">
            <label for="optionsInput">선택지 (한 줄에 하나씩, 2~10개)</label>
            <textarea id="optionsInput" style="min-height:120px" placeholder="Leadership&#10;Communication&#10;Empathy&#10;Confidence"></textarea>
          </div>

          <h3 style="margin-top:22px">Step 3. 결과 보여 주기</h3>
          <label for="viewSelect">결과 표시 방식 <span class="muted" style="font-weight:500">(결과 화면에서 언제든 바꿀 수 있어요)</span></label>
          <select id="viewSelect" style="max-width:320px"></select>
          <label class="check"><input type="checkbox" id="resultsVisible"> 학생 화면에서도 결과(친구들의 응답)를 보여 주기</label>
          <label class="check" id="votingRow"><input type="checkbox" id="allowVoting"> 친구들의 의견에 ♡ 투표 허용 <span class="muted">(결과 공개 시)</span></label>
          <label class="check"><input type="checkbox" id="allowMultiple"> 한 학생이 여러 번 응답 허용 <span class="muted">(끄면 다시 제출할 때 답이 수정돼요)</span></label>

          <fieldset>
            <legend>학생 정보 설정</legend>
            <label class="check"><input type="radio" name="identity" value="teacher" checked> 이름은 <b>선생님만</b> 보기 (친구들에게는 익명)</label>
            <label class="check"><input type="radio" name="identity" value="public"> 이름을 <b>친구들에게도</b> 공개</label>
            <label class="check"><input type="radio" name="identity" value="anonymous"> <b>완전 익명</b> (학번·이름을 받지 않음)</label>
            <div id="idChecks" class="row" style="gap:18px">
              <label class="check"><input type="checkbox" id="collectNo" checked> 학번 받기</label>
              <label class="check"><input type="checkbox" id="collectName" checked> 이름 받기</label>
            </div>
          </fieldset>

          <div class="row" style="margin-top:20px"><button class="primary" type="submit">활동 만들고 PIN 받기</button><button type="button" id="cancelBtn">취소</button></div>
          <p id="createError" class="error" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel" aria-labelledby="list-title">
        <h2 id="list-title">내 활동</h2>
        <p class="intro">학생은 <b id="joinUrl"></b> 에서 PIN을 입력해 참여해요.</p>
        <div id="acts" class="acts"></div>
      </section>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="common.js"></script>
  <script>
    const { api, $, esc, TYPES, VIEWS, friendly, toast, demoBanner } = LivePoll;
    demoBanner($('demo'));
    const joinUrl = new URL('index.html', location.href).href;
    $('joinUrl').textContent = joinUrl;
    let acts = [], timer = null;

    // ── 로그인 ──
    async function start() {
      const t = await api.getTeacher();
      $('loginPanel').classList.toggle('hidden', !!t);
      $('dash').classList.toggle('hidden', !t);
      if (!t) return;
      $('who').textContent = t.email;
      $('logoutBtn').classList.toggle('hidden', api.demo);
      loadActs();
      clearInterval(timer); timer = setInterval(loadActs, 5000);
    }
    $('loginForm').addEventListener('submit', async e => {
      e.preventDefault(); $('loginError').textContent = '';
      try { await api.signIn($('email').value.trim(), $('password').value); start(); }
      catch (err) { $('loginError').textContent = friendly(err).message; }
    });
    $('signupBtn').addEventListener('click', async () => {
      $('loginError').textContent = '';
      try {
        const loggedIn = await api.signUp($('email').value.trim(), $('password').value);
        if (loggedIn) start(); else $('loginError').textContent = '가입 확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인하세요.';
      } catch (err) { $('loginError').textContent = friendly(err).message; }
    });
    $('logoutBtn').addEventListener('click', async () => { await api.signOut(); clearInterval(timer); start(); });

    // ── 새 활동 만들기 ──
    $('typeTiles').innerHTML = Object.entries(TYPES).map(([k, t], i) =>
      `<label class="tile"><input type="radio" name="rtype" value="${k}" ${i === 0 ? 'checked' : ''}>${esc(t.label)}<small>${esc(t.hint)}</small></label>`).join('');
    const rtype = () => document.querySelector('input[name=rtype]:checked').value;
    const identity = () => document.querySelector('input[name=identity]:checked').value;
    function syncForm() {
      const t = rtype();
      $('optionsBox').classList.toggle('hidden', !TYPES[t].options);
      $('viewSelect').innerHTML = TYPES[t].views.map(v => `<option value="${v}">${VIEWS[v]}</option>`).join('');
      $('votingRow').classList.toggle('hidden', !LivePoll.TEXT_TYPES.includes(t));
      $('idChecks').classList.toggle('hidden', identity() === 'anonymous');
    }
    document.querySelectorAll('input[name=rtype], input[name=identity]').forEach(i => i.addEventListener('change', syncForm));
    syncForm();
    $('newBtn').addEventListener('click', () => { $('createPanel').classList.remove('hidden'); $('questionInput').focus(); });
    $('cancelBtn').addEventListener('click', () => $('createPanel').classList.add('hidden'));

    $('createForm').addEventListener('submit', async e => {
      e.preventDefault(); $('createError').textContent = '';
      const t = rtype(), question = $('questionInput').value.trim();
      const options = TYPES[t].options ? [...new Set($('optionsInput').value.split('\n').map(s => s.trim().slice(0, 80)).filter(Boolean))] : [];
      if (!question) { $('createError').textContent = '질문을 입력해 주세요.'; return; }
      if (TYPES[t].options && (options.length < 2 || options.length > 10)) { $('createError').textContent = '선택지를 2~10개 입력해 주세요. (한 줄에 하나씩)'; return; }
      const id = identity();
      try {
        const a = await api.createActivity({
          class_name: $('className').value.trim(), title: $('title').value.trim(), question,
          response_type: t, options, result_view: $('viewSelect').value,
          identity_mode: id, collect_student_no: id !== 'anonymous' && $('collectNo').checked, collect_name: id !== 'anonymous' && $('collectName').checked,
          results_visible: $('resultsVisible').checked, allow_voting: LivePoll.TEXT_TYPES.includes(t) && $('allowVoting').checked,
          allow_multiple: $('allowMultiple').checked,
        });
        $('createForm').reset(); syncForm();
        $('createPanel').classList.add('hidden');
        toast(`활동을 만들었어요! PIN ${a.pin}`);
        loadActs();
      } catch (err) { $('createError').textContent = friendly(err).message; }
    });

    // ── 내 활동 목록 ──
    async function loadActs() {
      try { acts = await api.myActivities(); } catch (err) { $('acts').innerHTML = `<p class="error">${esc(friendly(err).message)}</p>`; return; }
      if (!acts.length) { $('acts').innerHTML = '<p class="empty">아직 만든 활동이 없어요. ‘＋ 새 활동 만들기’를 눌러 시작하세요.</p>'; return; }
      const idLabel = { teacher: '이름: 선생님만', public: '이름: 공개', anonymous: '익명' };
      const html = acts.map(a => `
        <article class="act">
          <div class="row" style="justify-content:space-between">
            <span><span class="badge ${a.status}">${a.status === 'open' ? '진행 중' : '마감'}</span> <b>${esc([a.class_name, a.title].filter(Boolean).join(' · ') || '제목 없음')}</b></span>
            <span class="pin" title="PIN">${esc(a.pin)}</span>
          </div>
          <p class="q">${esc(a.question)}</p>
          <p class="meta">${esc(TYPES[a.response_type].label)} · ${idLabel[a.identity_mode]} · 결과 ${a.results_visible ? '학생 공개' : '비공개'} · <b>응답 ${a.response_count}개</b></p>
          <div class="row">
            <a class="btn primary small" href="screen.html?pin=${encodeURIComponent(a.pin)}" target="_blank" rel="noopener">결과 보기</a>
            <button class="small" data-act="copy" data-id="${esc(a.id)}">학생 링크 복사</button>
            <button class="small" data-act="toggle" data-id="${esc(a.id)}">${a.status === 'open' ? '응답 마감' : '다시 열기'}</button>
            <button class="small danger" data-act="delete" data-id="${esc(a.id)}">삭제</button>
          </div>
        </article>`).join('');
      if ($('acts')._html !== html) $('acts').innerHTML = $('acts')._html = html;
    }
    $('acts').addEventListener('click', async e => {
      const b = e.target.closest('button[data-act]'); if (!b) return;
      const a = acts.find(x => x.id === b.dataset.id); if (!a) return;
      try {
        if (b.dataset.act === 'copy') {
          const link = `${joinUrl}?pin=${a.pin}`;
          try { await navigator.clipboard.writeText(link); toast('복사했어요: ' + link); } catch { prompt('이 링크를 복사하세요', link); }
        } else if (b.dataset.act === 'toggle') {
          await api.updateActivity(a, { status: a.status === 'open' ? 'closed' : 'open' }); loadActs();
        } else if (b.dataset.act === 'delete') {
          if (!confirm(`“${a.question}” 활동과 모든 응답을 삭제할까요? 되돌릴 수 없어요.`)) return;
          await api.deleteActivity(a); loadActs();
        }
      } catch (err) { toast(friendly(err).message); }
    });

    start();
  </script>
</body>
</html>
